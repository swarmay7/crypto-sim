<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Cryptocurrency Simulator</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    :root{
      --bg-1:#061021; --bg-2:#071627;
      --panel: rgba(255,255,255,0.02);
      --muted:#9fb0c7;
      --accent-1:#0ea5e9; --accent-2:#2563eb;
      --radius:12px; --shadow:0 10px 26px rgba(2,6,23,0.6);
    }
    [data-theme="light"]{
      --bg-1:#f6fbff; --bg-2:#eef7ff; --panel:#ffffff; --muted:#3b556b;
    }
    *{box-sizing:border-box}
    html,body{height:100%;margin:0;font-family:Inter,system-ui,Arial;background:linear-gradient(180deg,var(--bg-1),var(--bg-2));color:#eaf8ff}
    .wrap{max-width:1100px;margin:28px auto;padding:18px}
    header{display:flex;align-items:center;justify-content:space-between;gap:12px}
    .brand{display:flex;align-items:center;gap:12px}
    .logo{width:56px;height:56px;border-radius:10px;background:linear-gradient(135deg,var(--accent-1),var(--accent-2));display:flex;align-items:center;justify-content:center;font-weight:800;color:white;box-shadow:0 8px 26px rgba(14,165,233,0.12)}
    h1{font-size:18px;margin:0}
    .subtitle{font-size:13px;color:var(--muted)}
    .controls{display:flex;align-items:center;gap:10px}
    .btn{padding:8px 12px;border-radius:10px;border:none;cursor:pointer;font-weight:700}
    .btn.primary{background:linear-gradient(90deg,var(--accent-1),var(--accent-2));color:white}
    .btn.ghost{background:transparent;border:1px solid rgba(255,255,255,0.06);color:inherit}
    .grid{display:grid;grid-template-columns:1fr 380px;gap:18px;margin-top:18px}
    @media(max-width:980px){.grid{grid-template-columns:1fr}}
    .card{background:var(--panel);padding:14px;border-radius:10px;box-shadow:var(--shadow);color:inherit}
    label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
    input,select{width:100%;padding:10px;border-radius:8px;border:1px solid rgba(255,255,255,0.04);background:transparent;color:inherit}
    .row{display:flex;gap:8px;align-items:center}
    .wallet-item{display:flex;justify-content:space-between;padding:10px;border-radius:8px;background:linear-gradient(180deg,rgba(255,255,255,0.01),transparent);margin-bottom:8px}
    .mempool-item{padding:10px;border-radius:8px;margin-bottom:8px;background:rgba(255,255,255,0.01)}
    .small{font-size:13px;color:var(--muted)}
    pre{background:rgba(0,0,0,0.08);padding:10px;border-radius:8px;color:var(--muted);font-size:13px;overflow:auto}
    .progress{height:12px;background:rgba(255,255,255,0.03);border-radius:999px;overflow:hidden}
    .progress-inner{height:100%;width:0%;background:linear-gradient(90deg,var(--accent-1),var(--accent-2));transition:width .2s ease}
    footer{margin-top:18px;color:var(--muted);font-size:13px;text-align:center}
  </style>
</head>
<body data-theme="dark">
  <div class="wrap">
    <header>
      <div class="brand">
        <div class="logo">CS</div>
        <div>
          <h1>Cryptocurrency Simulator</h1>
          <div class="subtitle">Interactive blockchain demo</div>
        </div>
      </div>
      <div class="controls">
        <label class="small" for="themeSwitch">Theme</label>
        <input type="checkbox" id="themeSwitch" aria-label="Toggle theme" />
        <button id="exportBtn" class="btn ghost">Export</button>
      </div>
    </header>

    <div class="grid">
      <main class="card" aria-labelledby="mainTitle">
        <div id="mainTitle" class="small"><strong>Transactions & Mining</strong></div>

        <div style="display:grid;grid-template-columns:1fr 260px;gap:12px;margin-top:10px">
          <section>
            <label for="from">From</label>
            <select id="from"></select>

            <label for="to" style="margin-top:8px">To</label>
            <input id="to" placeholder="recipient_pub" />

            <div class="row" style="margin-top:8px">
              <div style="flex:1">
                <label for="amount">Amount</label>
                <input id="amount" type="number" value="1" min="0.01" step="0.01" />
              </div>
              <div style="width:120px">
                <button id="addTx" class="btn primary" style="width:100%">Add</button>
              </div>
            </div>

            <div style="margin-top:12px" class="small">Mempool (<span id="mempoolCount">0</span>)</div>
            <div id="mempool" style="margin-top:8px;max-height:160px;overflow:auto"></div>
          </section>

          <aside class="card" style="padding:12px">
            <div style="display:flex;justify-content:space-between;align-items:center">
              <div class="small">Miner</div>
              <div style="font-weight:800" id="minerPub">miner_1</div>
            </div>

            <div style="margin-top:10px;display:flex;gap:8px">
              <button id="createWallet" class="btn ghost" style="flex:1">New wallet</button>
              <button id="validate" class="btn ghost" style="flex:1">Validate</button>
            </div>

            <div style="margin-top:12px">
              <div class="small">Progress</div>
              <div class="progress" style="margin-top:8px"><div id="progressInner" class="progress-inner"></div></div>
              <div style="display:flex;justify-content:space-between;margin-top:8px"><div class="small">Attempts: <span id="attempts">0</span></div><div class="small">Blocks: <span id="blocks">0</span></div></div>
            </div>
          </aside>
        </div>

        <section style="margin-top:14px">
          <div style="display:flex;justify-content:space-between;align-items:center"><div><strong>Chain</strong></div><div class="small">Blocks: <span id="blockCount">1</span></div></div>
          <div id="chainList" class="chain-grid" style="margin-top:8px;display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px"></div>
        </section>
      </main>

      <aside class="card">
        <div style="display:flex;justify-content:space-between;align-items:center"><div><strong>Wallets</strong></div><div class="small">Balances</div></div>
        <div id="wallets" style="margin-top:12px"></div>

        <div style="margin-top:12px;display:flex;gap:8px">
          <button id="exportState" class="btn ghost" style="flex:1">Export JSON</button>
          <button id="importState" class="btn ghost" style="flex:1">Import</button>
          <input id="importFile" type="file" accept="application/json" style="display:none" />
        </div>

        <div style="margin-top:12px">
          <div class="small">Balances</div>
          <div style="margin-top:8px"><canvas id="balanceChart" width="340" height="120"></canvas></div>
        </div>

        <div style="margin-top:12px"><pre id="status">Ready</pre></div>
      </aside>
    </div>

    <footer>Presentation-ready simulator</footer>
  </div>

  <div id="modal" style="display:none;position:fixed;inset:0;align-items:center;justify-content:center;background:rgba(0,0,0,0.5);">
    <div style="background:var(--panel);padding:12px;border-radius:10px;max-width:760px;margin:auto;color:inherit">
      <div style="display:flex;justify-content:space-between;align-items:center"><strong id="modalTitle">Block</strong><button id="modalClose" class="btn ghost">Close</button></div>
      <pre id="modalBody" style="margin-top:12px"></pre>
    </div>
  </div>

  <script>
    const utf8 = s => new TextEncoder().encode(s);
    async function sha256Hex(s){ const h = await crypto.subtle.digest('SHA-256', utf8(s)); return Array.from(new Uint8Array(h)).map(b=>b.toString(16).padStart(2,'0')).join(''); }
    function randId(n=6){ return Array.from(crypto.getRandomValues(new Uint8Array(n))).map(b=>b.toString(16).padStart(2,'0')).join('').slice(0,n); }
    function now(){ return Date.now(); }

    const STORAGE = 'simulator_clean_v1';
    let state = JSON.parse(localStorage.getItem(STORAGE) || 'null') || {
      chain: [{ index:0, timestamp: now(), transactions:[], previousHash:'0'.repeat(64), nonce:0, hash:'0'.repeat(64), miner:'genesis', reward:0 }],
      mempool: [], wallets: [ { pub:'alice', balance:100 }, { pub:'bob', balance:50 } ],
      minerPub:'miner_1', difficulty:3, attempts:0, blocks:0, theme:'dark'
    };

    const fromSel = document.getElementById('from'), walletsDiv = document.getElementById('wallets'), mempoolDiv = document.getElementById('mempool');
    const chainList = document.getElementById('chainList'), statusEl = document.getElementById('status');
    const addTxBtn = document.getElementById('addTx'), createWalletBtn = document.getElementById('createWallet');
    const validateBtn = document.getElementById('validate'), exportStateBtn = document.getElementById('exportState'), importStateBtn = document.getElementById('importState');
    const importFile = document.getElementById('importFile'), attemptsEl = document.getElementById('attempts'), blocksEl = document.getElementById('blocks');
    const progressInner = document.getElementById('progressInner') || document.getElementById('progressInner'), minerPubEl = document.getElementById('minerPub');
    const blockCountEl = document.getElementById('blockCount'), balanceCanvas = document.getElementById('balanceChart');
    const modal = document.getElementById('modal'), modalBody = document.getElementById('modalBody'), modalClose = document.getElementById('modalClose');
    const themeSwitch = document.getElementById('themeSwitch'), exportBtn = document.getElementById('exportBtn');

    // Chart.js
    const ctx = document.getElementById('balanceChart').getContext('2d');
    let balanceChart = new Chart(ctx, {
      type: 'bar',
      data: { labels: state.wallets.map(w=>w.pub), datasets: [{ label:'Balance', data: state.wallets.map(w=>w.balance||0), backgroundColor: function(ctx){ const g = ctx.chart.ctx.createLinearGradient(0,0,ctx.chart.width,0); g.addColorStop(0,'#0ea5e9'); g.addColorStop(1,'#2563eb'); return g; }, borderRadius:6 }] },
      options: { animation:{duration:500}, plugins:{legend:{display:false}}, scales:{ x:{ticks:{color:'#cfeaf7'}, grid:{display:false}}, y:{beginAtZero:true, ticks:{color:'#cfeaf7'}, grid:{color:'rgba(255,255,255,0.03)'}} } }
    });

    function save(){ try{ localStorage.setItem(STORAGE, JSON.stringify(state)); } catch(e){ console.warn('save failed'); } }

    function recalcBalances(){
      const b = {}; state.wallets.forEach(w=>b[w.pub]=0);
      for(const block of state.chain){
        for(const tx of (block.transactions||[])){ b[tx.from] = (b[tx.from]||0) - Number(tx.amount); b[tx.to] = (b[tx.to]||0) + Number(tx.amount); }
        if(block.miner) b[block.miner] = (b[block.miner]||0) + (block.reward||0);
      }
      state.wallets = state.wallets.map(w=>({ ...w, balance: (b[w.pub] ?? w.balance ?? 0) }));
    }

    function renderWallets(){ fromSel.innerHTML=''; walletsDiv.innerHTML=''; state.wallets.forEach(w=>{ const opt=document.createElement('option'); opt.value=w.pub; opt.textContent = `${w.pub} (${Number(w.balance||0).toFixed(2)})`; fromSel.appendChild(opt); const el=document.createElement('div'); el.className='wallet-item'; el.innerHTML = `<div style="font-weight:700">${w.pub}</div><div style="font-weight:800">${Number(w.balance||0).toFixed(2)}</div>`; walletsDiv.appendChild(el); }); }

    function renderMempool(){ mempoolDiv.innerHTML=''; state.mempool.forEach(tx=>{ const d=document.createElement('div'); d.className='mempool-item'; d.innerHTML = `<div class="small">${tx.id} · ${new Date(tx.timestamp).toLocaleTimeString()}</div><div style="margin-top:6px"><strong>${tx.from}</strong> → <strong>${tx.to}</strong> : <strong>${Number(tx.amount).toFixed(2)}</strong></div>`; mempoolDiv.appendChild(d); }); document.getElementById('mempoolCount').textContent = state.mempool.length; }

    async function renderChain(){ chainList.innerHTML=''; blockCountEl.textContent = state.chain.length; const reversed = [...state.chain].reverse(); for(const block of reversed){ const b=document.createElement('div'); b.className='card'; b.style.padding='10px'; const txCount = (block.transactions || []).length; b.innerHTML = `<div class="small">Block #${block.index} · ${new Date(block.timestamp).toLocaleString()}</div><div style="margin-top:8px;display:flex;justify-content:space-between;align-items:center"><div><strong>${block.miner}</strong><div class="small">Txs: ${txCount} · nonce: ${block.nonce}</div></div><div><div class="small">${block.reward || 0}</div></div></div><div style="margin-top:8px;color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${block.hash}</div><div style="margin-top:8px;display:flex;justify-content:flex-end"><button class="btn ghost" data-action="view" data-index="${block.index}">View</button></div>`; chainList.appendChild(b); } }

    function updateChart(){ balanceChart.data.labels = state.wallets.map(w=>w.pub); balanceChart.data.datasets[0].data = state.wallets.map(w=>Number(w.balance||0)); balanceChart.update(); }

    function updateUI(){ recalcBalances(); renderWallets(); renderMempool(); renderChain(); updateChart(); document.getElementById('minerPub').textContent = state.minerPub; attemptsEl.textContent = state.attempts; blocksEl.textContent = state.blocks; save(); }

    document.getElementById('createWallet').addEventListener('click', ()=>{ const w = { pub:'user_'+randId(4), balance:0 }; state.wallets.push(w); updateUI(); statusEl.textContent = 'Created ' + w.pub; });

    document.getElementById('addTx').addEventListener('click', ()=>{ const from = fromSel.value; const to = document.getElementById('to').value.trim(); const amount = Number(document.getElementById('amount').value); if(!from||!to||!amount||amount<=0){ statusEl.textContent='Invalid transaction'; return; } const sender = state.wallets.find(w=>w.pub===from); if(!sender|| (sender.balance||0) < amount){ statusEl.textContent='Insufficient balance'; return; } const tx = { id:'tx_'+randId(6), from, to, amount: Number(amount.toFixed(2)), timestamp: now() }; state.mempool.push(tx); updateUI(); statusEl.textContent = 'Added ' + tx.id; });

    // difficulty simple control via number input (kept at default 3)
    state.difficulty = state.difficulty || 3;

    let mining = false;

    async function calculateHash(c){ const raw = `${c.index}|${c.timestamp}|${c.previousHash}|${c.nonce}|${c.miner}|${c.reward}|${JSON.stringify(c.transactions||[])}`; return await sha256Hex(raw); }

    async function mineOnce(minerPub){
      const prev = state.chain[state.chain.length - 1];
      const index = prev.index + 1;
      const timestamp = now();
      const txs = state.mempool.slice(0,6);
      const reward = 10;
      let nonce = 0;
      const target = '0'.repeat(state.difficulty);
      let inner = 0;
      statusEl.textContent = 'Mining block #' + index;
      while(mining){
        const cand = { index,timestamp,transactions:txs,previousHash:prev.hash,nonce,miner:minerPub,reward };
        const h = await calculateHash(cand);
        state.attempts++; inner++;
        if(h.startsWith(target)){
          cand.hash = h;
          state.chain.push(cand);
          state.mempool = state.mempool.slice(txs.length);
          state.blocks++;
          statusEl.textContent = 'Mined block #' + index;
          updateUI();
          document.getElementById('progressInner').style.width = '0%';
          return;
        }
        nonce++;
        if(inner % 800 === 0){ attemptsEl.textContent = state.attempts; document.getElementById('progressInner').style.width = Math.min(100, (inner % 100000) / 1000) + '%'; await new Promise(r=>setTimeout(r,0)); }
        if(inner > 800000){ statusEl.textContent = 'Nonce limit'; break; }
      }
      statusEl.textContent = 'Mining stopped';
    }

    async function miningLoop(){ while(mining){ await mineOnce(state.minerPub); await new Promise(r=>setTimeout(r,200)); } }

    document.getElementById('toggleMine')?.addEventListener('click', function(){
      mining = !mining;
      this.textContent = mining ? 'Stop Mining' : 'Start Mining';
      if(mining){ miningLoop(); } else { /* loop will exit naturally */ }
    });

    document.getElementById('validate').addEventListener('click', async ()=>{
      statusEl.textContent = 'Validating...';
      for(let i=1;i<state.chain.length;i++){
        const b = state.chain[i], p = state.chain[i-1];
        if(b.previousHash !== p.hash){ statusEl.textContent = 'Invalid prevHash at ' + i; return; }
        const expected = await calculateHash({ index:b.index, timestamp:b.timestamp, transactions:b.transactions, previousHash:b.previousHash, nonce:b.nonce, miner:b.miner, reward:b.reward });
        if(expected !== b.hash){ statusEl.textContent = 'Invalid hash at ' + i; return; }
        if(!b.hash.startsWith('0'.repeat(state.difficulty))){ statusEl.textContent = 'Block ' + i + ' fails difficulty'; return; }
      }
      statusEl.textContent = 'Chain valid';
    });

    exportStateBtn.addEventListener('click', ()=>{
      const data = JSON.stringify({ chain: state.chain, mempool: state.mempool, wallets: state.wallets }, null, 2);
      const blob = new Blob([data], { type:'application/json' });
      const url = URL.createObjectURL(blob); const a = document.createElement('a'); a.href = url; a.download = 'sim_chain.json'; a.click(); URL.revokeObjectURL(url);
    });

    importStateBtn.addEventListener('click', ()=> importFile.click());
    importFile.addEventListener('change', (ev)=>{
      const f = ev.target.files[0]; if(!f) return; const r = new FileReader(); r.onload = ()=>{ try{ const obj = JSON.parse(r.result); if(obj.chain) state.chain = obj.chain; if(obj.mempool) state.mempool = obj.mempool; if(obj.wallets) state.wallets = obj.wallets; updateUI(); statusEl.textContent = 'Imported'; } catch(e){ statusEl.textContent = 'Import failed'; } }; r.readAsText(f);
    });

    chainList.addEventListener('click', (e)=>{ const btn = e.target.closest('button'); if(!btn) return; if(btn.dataset.action === 'view'){ const idx = Number(btn.dataset.index); const block = state.chain.find(b=>b.index===idx); modal.style.display = 'flex'; modal.querySelector('#modalBody').textContent = JSON.stringify(block, null, 2); } });

    modalClose.addEventListener('click', ()=> modal.style.display = 'none');

    exportBtn.addEventListener('click', ()=>{ const data = JSON.stringify({ chain: state.chain, mempool: state.mempool, wallets: state.wallets }, null, 2); const blob = new Blob([data], { type:'application/json' }); const url = URL.createObjectURL(blob); const a = document.createElement('a'); a.href = url; a.download = 'sim_chain.json'; a.click(); URL.revokeObjectURL(url); });

    // Theme toggle
    function applyTheme(t){ if(t === 'light'){ document.documentElement.setAttribute('data-theme','light'); themeSwitch.checked = true; } else { document.documentElement.setAttribute('data-theme','dark'); themeSwitch.checked = false; } state.theme = t; save(); }
    themeSwitch.addEventListener('change', ()=> applyTheme(themeSwitch.checked ? 'light' : 'dark'));
    applyTheme(state.theme || 'dark');

    // init
    updateUI();
    window.addEventListener('beforeunload', ()=> save());
  </script>
</body>
</html>
